services:
  - type: web
    name: konain-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/storage/portfolio.db
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 1
